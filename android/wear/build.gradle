apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.ironpath.watch'
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId 'com.ironpath.app'
        minSdk 30
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 6
        versionName '0.5.1'
    }
    buildFeatures { compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions { jvmTarget = '21' }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation project(':wear-link')
    implementation platform('androidx.compose:compose-bom:2025.08.00')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.wear.compose:compose-material3:1.5.6'
    implementation 'androidx.wear.compose:compose-foundation:1.5.6'
    implementation 'androidx.wear.compose:compose-navigation:1.5.6'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material:material-icons-core'        // already transitive at runtime via material3
    implementation 'androidx.wear:wear:1.3.0'                                  // AmbientLifecycleObserver
    implementation 'androidx.wear:wear-ongoing:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'       // collectAsStateWithLifecycle
    debugImplementation 'androidx.wear.compose:compose-ui-tooling:1.5.6'      // Wear preview annotations
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
